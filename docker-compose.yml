# FalkorDB for Domesday.
#   docker compose up -d
# Ports are configurable: FALKORDB_PORT (default 6379), FALKORDB_BROWSER_PORT (default 3000).
# Verify the module args took effect:
#   docker compose exec falkordb redis-cli GRAPH.CONFIG GET MAX_QUEUED_QUERIES
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ${FALKORDB_CONTAINER_NAME:-domesday-falkordb}
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"
    environment:
      # Replaces the image default "MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000" (E17, D28).
      # TIMEOUT is deprecated; TIMEOUT_DEFAULT/TIMEOUT_MAX bound query time instead (ms).
      FALKORDB_ARGS: >-
        MAX_QUEUED_QUERIES 1000
        TIMEOUT_DEFAULT 30000
        TIMEOUT_MAX 120000
        RESULTSET_SIZE 100000
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  falkordb-data:
