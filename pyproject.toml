[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domesday"
version = "0.1.0"
description = "Temporal knowledge-graph memory for AI agents, built on FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "falkordb>=1.8,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2", "uvicorn>=0.30"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
local = ["fastembed>=0.4"]
all = ["domesday[mcp,anthropic,openai,local]"]
dev = ["pytest>=8"]

[project.scripts]
domesday-mcp = "domesday.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live FalkorDB (skipped when unreachable)",
    "slow: long-running concurrency tests",
]
